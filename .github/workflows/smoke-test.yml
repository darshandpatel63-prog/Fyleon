name: Android Smoke Test

# Starts the app in an emulator and saves the crash log + screenshots.
# Run it manually: Actions > Android Smoke Test > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      - name: Get packages and patch Android project
        run: |
          flutter pub get
          python3 tool/patch_android.py

      - name: Build release APK for the x86_64 emulator
        run: flutter build apk --release --target-platform android-x64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Start emulator, launch Fyleon, collect logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tool/smoke_test.sh

      - name: Show result in the job summary
        if: always()
        run: |
          {
            echo "## Smoke test result"
            echo '```'
            cat smoke-output/result.txt 2>/dev/null || echo "no result file (emulator did not start?)"
            echo '```'
            echo "### Crash summary"
            echo '```'
            head -60 smoke-output/summary.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-output
          path: smoke-output/
          retention-days: 14
