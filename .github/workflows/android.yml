name: Android Build

on:
  # A version tag (v1.2.3) always builds the RELEASE. Normal pushes do NOT build (saves minutes);
  # start builds yourself: Actions > Android Build > Run workflow, then choose release or debug.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Which app? release = REAL ads, signed APK + AAB (for the stores) | debug = TEST ads, debug key, APK only (quick)'
        type: choice
        options:
          - release
          - debug
        default: release
      draft_release:
        description: 'Create a DRAFT GitHub release with the files (easy to download on the phone)'
        type: boolean
        default: true

env:
  # tag push = release; manual run = the choice above
  VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.build_variant || 'release' }}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A queued run may start from an older commit. Always build the latest branch tip,
      # so android/ (committed by an earlier run) is not created twice.
      - name: Sync with the latest branch
        if: github.ref_type == 'branch'
        run: git pull --ff-only origin "${{ github.ref_name }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to 3.47.x on purpose: package:flutter/material.dart is deprecated
      # in the Fall 2026 stable. Migrate deliberately (see HANDOVER.md).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create android/ folder (first run only)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.fyleon --project-name app --platforms=android .
            echo "BOOTSTRAPPED=true" >> "$GITHUB_ENV"
          fi

      - name: Get packages
        run: flutter pub get

      - name: Check the AdMob ids (release build only)
        if: env.VARIANT == 'release'
        run: |
          python3 - <<'PY'
          import json, sys
          c = json.load(open('config/fyleon_config.json'))['admob']['android']
          need = ['appId', 'banner', 'interstitial', 'rewarded', 'native']
          missing = [k for k in need if not (c.get(k) or '').strip()]
          test = [k for k in need if 'ca-app-pub-3940256099942544' in (c.get(k) or '')]
          if missing or test:
              print('::error::A release build needs the REAL AdMob ids in config/fyleon_config.json (android). Missing: %s. Google test ids found in: %s.' % (missing, test))
              sys.exit(1)
          print('Real AdMob ids found for:', ', '.join(need))
          PY

      - name: Patch Android project (label, permissions, AdMob id, minSdk)
        run: python3 tool/patch_android.py

      - name: Generate launcher icons and native splash (first run only)
        if: env.BOOTSTRAPPED == 'true'
        run: |
          flutter pub add --dev flutter_launcher_icons flutter_native_splash
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter pub remove flutter_launcher_icons flutter_native_splash

      - name: Commit generated files to the branch
        if: github.ref_type == 'branch'
        run: |
          git config user.name "fyleon-bot"
          git config user.email "fyleon-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: generated Android files [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "push failed, retry $i"; sleep 4
            done
          fi

      # Done AFTER the commit above, so the committed android/ folder stays the same for every build.
      - name: "Set the ads mode: release = REAL ads, debug = TEST ads"
        run: |
          if [ "$VARIANT" = "release" ]; then ADS=live; else ADS=test; fi
          echo "ADS_MODE=$ADS" >> "$GITHUB_ENV"
          FYLEON_ADS=$ADS python3 tool/patch_android.py
          M=android/app/src/main/AndroidManifest.xml
          if [ "$ADS" = "live" ]; then
            REAL=$(python3 -c "import json;print(json.load(open('config/fyleon_config.json'))['admob']['android']['appId'])")
            grep -q "$REAL" "$M" || { echo "::error::Real AdMob app id is missing in the manifest"; exit 1; }
          else
            grep -q "ca-app-pub-3940256099942544~3347511713" "$M" || { echo "::error::Test AdMob app id is missing in the manifest"; exit 1; }
          fi
          echo "Ads mode: $ADS (variant: $VARIANT)"

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Read version
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build APK (RELEASE, real ads)
        if: env.VARIANT == 'release'
        run: flutter build apk --release --build-number=${{ github.run_number }} --target-platform android-arm,android-arm64 --dart-define=FYLEON_ADS=live

      - name: Build AAB (RELEASE, real ads)
        if: env.VARIANT == 'release'
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=FYLEON_ADS=live

      - name: Build APK (DEBUG, test ads)
        if: env.VARIANT == 'debug'
        run: flutter build apk --debug --build-number=${{ github.run_number }} --target-platform android-arm,android-arm64 --dart-define=FYLEON_ADS=test

      - name: Prepare signing key
        id: ks
        if: env.VARIANT == 'release'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Release build needs the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (Settings > Secrets and variables > Actions). A release with real ads must never use the debug key."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Collect outputs
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          B="${{ github.run_number }}"
          mkdir -p dist

          if [ "$VARIANT" = "release" ]; then
            APK=build/app/outputs/flutter-apk/app-release.apk
            AAB=build/app/outputs/bundle/release/app-release.aab
            # --- AAB: drop the old (debug) signature, sign with the upload key
            zip -q -d "$AAB" 'META-INF/*' || true
            jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
            cp "$AAB" "dist/Fyleon-$V-b$B-release.aab"

            # --- APK: strip, align, sign
            cp "$APK" "$RUNNER_TEMP/stripped.apk"
            zip -q -d "$RUNNER_TEMP/stripped.apk" 'META-INF/*' || true
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/stripped.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" \
              --out "dist/Fyleon-$V-b$B-release.apk" "$RUNNER_TEMP/aligned.apk"
          else
            cp build/app/outputs/flutter-apk/app-debug.apk "dist/Fyleon-$V-b$B-DEBUG-testads.apk"
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist
          {
            echo "## Fyleon $V (build $B): $VARIANT"
            echo "- Package name: \`com.fyleon.app\`"
            if [ "$VARIANT" = "release" ]; then
              echo "- Ads: **REAL** AdMob ads (do not click your own ads)"
              echo "- Files: signed APK (Amazon Appstore / sideload) and AAB (Google Play)"
            else
              echo "- Ads: **TEST** ads only (safe to click). Debug key, APK only. Not for the stores."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: fyleon-android-b${{ github.run_number }}-${{ env.VARIANT }}
          path: dist/*
          retention-days: 30

      - name: Create DRAFT release
        if: (github.event_name == 'workflow_dispatch' && inputs.draft_release) || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ env.VARIANT == 'debug' }}
          name: Fyleon v${{ steps.ver.outputs.version }} (build ${{ github.run_number }}, ${{ env.VARIANT == 'debug' && 'DEBUG test ads' || 'RELEASE' }})
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build{1}-{2}', steps.ver.outputs.version, github.run_number, env.VARIANT) }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
