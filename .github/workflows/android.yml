name: Android Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Create a DRAFT GitHub release with the APK and AAB'
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A queued run may start from an older commit. Always build the latest branch tip,
      # so android/ (committed by an earlier run) is not created twice.
      - name: Sync with the latest branch
        if: github.ref_type == 'branch'
        run: git pull --ff-only origin "${{ github.ref_name }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to 3.47.x on purpose: package:flutter/material.dart is deprecated
      # in the Fall 2026 stable. Migrate deliberately (see HANDOVER.md).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.x'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create android/ folder (first run only)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.fyleon --project-name app --platforms=android .
            echo "BOOTSTRAPPED=true" >> "$GITHUB_ENV"
          fi

      - name: Get packages
        run: flutter pub get

      - name: Patch Android project (label, permissions, AdMob id, minSdk)
        run: python3 tool/patch_android.py

      - name: Generate launcher icons and native splash (first run only)
        if: env.BOOTSTRAPPED == 'true'
        run: |
          flutter pub add --dev flutter_launcher_icons flutter_native_splash
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter pub remove flutter_launcher_icons flutter_native_splash

      - name: Commit generated files to the branch
        if: github.ref_type == 'branch'
        run: |
          git config user.name "fyleon-bot"
          git config user.email "fyleon-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: generated Android files [skip ci]"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "push failed, retry $i"; sleep 4
            done
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Read version
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build APK (release)
        run: flutter build apk --release --build-number=${{ github.run_number }} --target-platform android-arm,android-arm64

      - name: Build AAB (release)
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Prepare signing key (optional)
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret found: APK/AAB will use the debug key (OK for testing, NOT for Play Store)."
          fi

      - name: Collect outputs
        env:
          HAS_KEY: ${{ steps.ks.outputs.has_key }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          V="${{ steps.ver.outputs.version }}"
          B="${{ github.run_number }}"
          mkdir -p dist
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab

          if [ "$HAS_KEY" = "true" ]; then
            # --- AAB: drop the old (debug) signature, sign with the upload key
            zip -q -d "$AAB" 'META-INF/*' || true
            jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
            cp "$AAB" "dist/Fyleon-$V-b$B.aab"

            # --- APK: strip, align, sign
            cp "$APK" "$RUNNER_TEMP/stripped.apk"
            zip -q -d "$RUNNER_TEMP/stripped.apk" 'META-INF/*' || true
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/stripped.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" \
              --out "dist/Fyleon-$V-b$B.apk" "$RUNNER_TEMP/aligned.apk"
          else
            cp "$AAB" "dist/Fyleon-$V-b$B-DEBUGKEY-not-for-play.aab"
            cp "$APK" "dist/Fyleon-$V-b$B-debugkey.apk"
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: fyleon-android-b${{ github.run_number }}
          path: dist/*
          retention-days: 30

      - name: Create DRAFT release
        if: (github.event_name == 'workflow_dispatch' && inputs.draft_release) || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Fyleon v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build{1}', steps.ver.outputs.version, github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
