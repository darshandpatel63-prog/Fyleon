name: fyleon
description: "Fyleon - open anything. Universal file viewer and editor."
publish_to: "none"
# version: <name>+<build>. The CI overrides the build number with the run number.
version: 0.8.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ">=2.6.1 <3.0.0"
  shared_preferences: ">=2.3.2 <3.0.0"
  path: ^1.9.0
  file_picker: ">=12.3.0 <14.0.0"
  permission_handler: ">=11.3.1 <13.0.0"
  google_mobile_ads: ">=6.0.0 <10.0.0"
  # pdfrx 2.6.5+ is REQUIRED on Flutter 3.47 / Dart 3.13 (older pdfrx_engine does not compile).
  pdfrx: ">=2.6.5 <3.0.0"
  archive: ">=3.6.1 <5.0.0"
  xml: ">=6.5.0 <7.0.0"
  html: ">=0.15.4 <0.16.0"
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  markdown: ">=7.2.0 <8.0.0"
  webview_flutter: ">=4.10.0 <5.0.0"
  video_player: ">=2.9.0 <3.0.0"
  path_provider: ">=2.1.4 <3.0.0"
  crypto: ">=3.0.3 <4.0.0"
  # Session 8
  image: ">=4.2.0 <5.0.0" # photo editor (was already a transitive dependency)
  just_audio: ">=0.9.40 <1.0.0" # audio engine (also plays the sound of videos in the background)
  just_audio_background: ">=0.0.1-beta.13 <1.0.0" # notification + lock screen controls
  qr_flutter: ">=4.1.0 <5.0.0" # Dash: QR code of the sender
  mobile_scanner: ">=6.0.2 <9.0.0" # Dash: scan the QR code

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - config/

# Icon/splash generator CONFIG only. The tools are NOT dependencies on purpose:
# flutter_native_splash was compiled against an old Android SDK and broke the
# release build (checkReleaseAarMetadata). android.yml adds them temporarily
# (flutter pub add/remove) when it creates the android/ folder.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_mono.png"

flutter_native_splash:
  color: "#4F46E5"
  image: assets/icon/icon_foreground.png
  android_12:
    color: "#4F46E5"
    image: assets/icon/icon_foreground.png
